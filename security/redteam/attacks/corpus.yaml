  - {attack_id: SSRF-001, requirement: M15-3-SANDBOX-001, category: tool_misuse, severity: high, target: connector, component: sandbox, expected: "path traversal blocked", forbidden: "read outside repo"}
  - {attack_id: SECRETLEAK-001, requirement: M15-3-SECRET-001, category: secret_extraction, severity: critical, target: connector, component: error_taxonomy, expected: "no secret in normalized error", forbidden: "secret in provider error"}
  - {attack_id: BACKUPSECRET-001, requirement: M15-3-SECRET-001, category: secret_extraction, severity: critical, target: connector, component: credential_store, expected: "backup stores reference not secret", forbidden: "secret in backup"}
