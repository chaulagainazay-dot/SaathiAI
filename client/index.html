<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Baadar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0a12;
         color: #e8e8f0; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Orb ---------- */
  #orbZone { display: flex; flex-direction: column; align-items: center;
             padding: 26px 0 10px; flex-shrink: 0; cursor: pointer; user-select: none; }
  #orb { width: 120px; height: 120px; border-radius: 50%; position: relative;
         background: radial-gradient(circle at 35% 30%, #c4b5fd, #7c3aed 55%, #4c1d95);
         box-shadow: 0 0 40px rgba(124,58,237,.45);
         transition: box-shadow .4s, transform .4s; }
  #orb::before, #orb::after { content:''; position: absolute; inset: -10px;
         border-radius: 50%; border: 2px solid rgba(167,139,250,.35); opacity: 0; }

  /* idle: gentle breathing */
  body[data-state="idle"] #orb { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.05);
        box-shadow: 0 0 55px rgba(124,58,237,.6); } }

  /* listening: expanding rings + glow follows voice level */
  body[data-state="listening"] #orb {
        background: radial-gradient(circle at 35% 30%, #93c5fd, #2563eb 55%, #1e3a8a);
        box-shadow: 0 0 calc(40px + var(--level, 0px)) rgba(59,130,246,.7);
        transform: scale(calc(1 + var(--levelScale, 0))); }
  body[data-state="listening"] #orb::before { animation: ring 1.6s ease-out infinite; }
  body[data-state="listening"] #orb::after  { animation: ring 1.6s .8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: .8; }
                    100% { transform: scale(1.55); opacity: 0; } }

  /* thinking: spin shimmer */
  body[data-state="thinking"] #orb {
        background: conic-gradient(from 0deg, #7c3aed, #2563eb, #10b981, #7c3aed);
        animation: spin 1.1s linear infinite;
        box-shadow: 0 0 50px rgba(16,185,129,.5); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* speaking: green pulse */
  body[data-state="speaking"] #orb {
        background: radial-gradient(circle at 35% 30%, #6ee7b7, #10b981 55%, #065f46);
        animation: talk .55s ease-in-out infinite;
        box-shadow: 0 0 55px rgba(16,185,129,.65); }
  @keyframes talk { 50% { transform: scale(1.08); } }

  #stateLabel { margin-top: 14px; font-size: 14px; color: #a78bfa;
                font-weight: 600; letter-spacing: .3px; }
  #hint { font-size: 11px; color: #555; margin-top: 4px; }

  /* ---------- Transcript ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 10px 18px;
          display: flex; flex-direction: column; gap: 9px; }
  .msg { max-width: 86%; padding: 9px 14px; border-radius: 14px; font-size: 14px;
         line-height: 1.5; white-space: pre-wrap; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }
  .user { align-self: flex-end; background: #4c1d95; }
  .saathi { align-self: flex-start; background: #16161e; border: 1px solid #2a2a3a; }
  .meta { font-size: 10px; color: #555; align-self: center; }

  /* ---------- Live steps (mirror of what Baadar is doing) ---------- */
  .steps { align-self: flex-start; max-width: 92%; background: #0f0f18;
           border: 1px solid #23233a; border-radius: 14px; padding: 9px 13px;
           font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .steps-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px;
                 color: #5a5a72; display: flex; align-items: center; gap: 6px; }
  .steps-title::before { content: ''; width: 7px; height: 7px; border-radius: 50%;
                 background: #10b981; animation: blink 1s ease-in-out infinite; }
  .steps.finished .steps-title::before { animation: none; background: #444; }
  @keyframes blink { 50% { opacity: .25; } }
  .st { display: block; line-height: 1.45; animation: pop .2s ease-out; color: #8a8aa0; }
  .st.tool   { color: #c4b5fd; font-weight: 600; }
  .st.result { color: #6ee7b7; }
  .st.think  { color: #6f6f88; font-style: italic; }
  .st.done   { color: #10b981; font-weight: 700; }

  /* ---------- Bottom bar ---------- */
  footer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
           display: flex; gap: 9px; border-top: 1px solid #1c1c28; }
  #textIn { flex: 1; background: #14141e; border: 1px solid #2a2a3a; color: #eee;
            border-radius: 20px; padding: 10px 15px; font-size: 14px; outline: none; }
  button { border: none; border-radius: 20px; padding: 0 16px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  #sendBtn { background: #7c3aed; color: #fff; }

  /* ---------- Sidebar / chat history ---------- */
  #menuBtn { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; z-index: 30;
    width: 38px; height: 38px; padding: 0; border-radius: 11px; background: #16161e;
    border: 1px solid #2a2a3a; color: #c4b5fd; font-size: 17px; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0;
    pointer-events: none; transition: opacity .25s; }
  body.nav-open #scrim { opacity: 1; pointer-events: auto; }
  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 270px; max-width: 82vw; z-index: 41;
    background: #0d0d16; border-right: 1px solid #1c1c28; transform: translateX(-100%);
    transition: transform .25s ease; display: flex; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); }
  body.nav-open #sidebar { transform: translateX(0); }
  .sb-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; padding: 0 4px; }
  .sb-head b { font-size: 15px; color: #ddd6fe; }
  #newChatBtn { background: #7c3aed; color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  #convoList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .convo { display: flex; align-items: center; gap: 4px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; color: #b8b8c8; font-size: 13px; }
  .convo:hover { background: #16161e; }
  .convo.active { background: #241a3d; color: #fff; }
  .convo .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .ic { opacity: 0; font-size: 12px; padding: 2px 5px; border-radius: 6px; }
  .convo:hover .ic { opacity: .55; }
  .convo .ic:hover { opacity: 1; background: #2a2a3a; }
  #addBtn { background: #16161e; color: #c4b5fd; border: 1px solid #2a2a3a;
    padding: 0 14px; font-size: 22px; line-height: 1; }

  /* ---------- Drag & drop ---------- */
  #dropOverlay { position: fixed; inset: 0; background: rgba(124,58,237,.18);
      border: 3px dashed #a78bfa; display: none; align-items: center;
      justify-content: center; z-index: 50; backdrop-filter: blur(2px);
      font-size: 20px; color: #ddd6fe; font-weight: 700; }
  body.dragging #dropOverlay { display: flex; }
</style>
</head>
<body data-state="idle">

<button id="menuBtn" title="Chats">☰</button>
<div id="scrim"></div>
<aside id="sidebar">
  <div class="sb-head"><b>🏔️ Baadar</b><button id="newChatBtn">+ New</button></div>
  <div id="convoList"></div>
</aside>

<div id="orbZone" title="Tap orb to toggle hands-free listening">
  <div id="orb"></div>
  <div id="stateLabel">tap the orb to start listening</div>
  <div id="hint">☰ chats · नेपाली or English · drag files or tap +</div>
</div>

<div id="chat"></div>

<footer>
  <button id="addBtn" title="Attach file, PDF or image">+</button>
  <input id="fileIn" type="file" multiple hidden
         accept="image/*,application/pdf,.doc,.docx,.txt,.csv,.xlsx">
  <input id="textIn" placeholder="type to Baadar…" autocomplete="off">
  <button id="sendBtn">Send</button>
</footer>

<div id="dropOverlay">📂 Drop files for Baadar</div>

<script>
const API = location.origin;
const $ = id => document.getElementById(id);

// access key: arrives once as #token=… in the URL, then lives in localStorage
if (location.hash.startsWith('#token=')) {
  localStorage.setItem('saathi_token', location.hash.slice(7));
  history.replaceState(null, '', location.pathname);
}
const TOKEN = localStorage.getItem('saathi_token') || '';
const _fetch = window.fetch;
window.fetch = (url, opts = {}) => {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? {'X-Saathi-Token': TOKEN} : {});
  return _fetch(url, opts);
};
const chat = $('chat'), label = $('stateLabel'), orbZone = $('orbZone');

let state = 'idle';
function setState(s, text) {
  state = s;
  document.body.dataset.state = s;
  label.textContent = text || {
    idle: 'tap the orb to start listening',
    listening: 'listening…',
    thinking: 'thinking…',
    speaking: 'Baadar is speaking…',
  }[s];
}

// low-level DOM render (no persistence) — used when replaying history
function renderMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function renderMeta(text) {
  const d = document.createElement('div');
  d.className = 'meta'; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
// render + save into the current conversation
function addMsg(text, cls) { renderMsg(text, cls); pushMsg(cls === 'user' ? 'user' : 'saathi', text, false); }
function addMeta(text)      { renderMeta(text);       pushMsg('meta', text, true); }

/* ============ Conversation history (categorise your work) ============ */
const CONVO_KEY = 'baadar_convos', CUR_KEY = 'baadar_cur';
let convos = []; try { convos = JSON.parse(localStorage.getItem(CONVO_KEY) || '[]'); } catch (e) {}
let curId = localStorage.getItem(CUR_KEY) || '';

const saveConvos = () => localStorage.setItem(CONVO_KEY, JSON.stringify(convos));
const curConvo = () => convos.find(c => c.id === curId);
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const session = () => curId || 'default';

function pushMsg(role, text, isMeta) {
  const c = curConvo(); if (!c) return;
  c.msgs.push({ role, text, meta: !!isMeta });
  if (c.title === 'New chat' && role === 'user' && !isMeta) c.title = text.slice(0, 42);
  c.ts = Date.now();
  saveConvos(); renderConvoList();
}

function renderChat() {
  chat.innerHTML = '';
  const c = curConvo();
  (c ? c.msgs : []).forEach(m => m.meta ? renderMeta(m.text)
        : renderMsg(m.text, m.role === 'user' ? 'user' : 'saathi'));
}

function renderConvoList() {
  const list = $('convoList'); list.innerHTML = '';
  convos.slice().sort((a, b) => b.ts - a.ts).forEach(c => {
    const row = document.createElement('div');
    row.className = 'convo' + (c.id === curId ? ' active' : '');
    row.innerHTML = `<span class="nm"></span>`
      + `<span class="ic" data-act="rename" title="Rename / categorise">✎</span>`
      + `<span class="ic" data-act="del" title="Delete">🗑</span>`;
    row.querySelector('.nm').textContent = c.title || 'Untitled';
    row.querySelector('.nm').onclick = () => switchConvo(c.id);
    row.querySelector('[data-act=rename]').onclick = e => { e.stopPropagation(); renameConvo(c.id); };
    row.querySelector('[data-act=del]').onclick = e => { e.stopPropagation(); deleteConvo(c.id); };
    list.appendChild(row);
  });
}

function newConvo() {
  const c = { id: newId(), title: 'New chat', msgs: [], ts: Date.now() };
  convos.unshift(c); curId = c.id; localStorage.setItem(CUR_KEY, curId);
  saveConvos(); renderConvoList(); renderChat(); closeNav();
}
function switchConvo(id) { curId = id; localStorage.setItem(CUR_KEY, id); renderConvoList(); renderChat(); closeNav(); }
function renameConvo(id) {
  const c = convos.find(x => x.id === id); if (!c) return;
  const t = prompt('Name this chat / category:', c.title);
  if (t !== null) { c.title = t.trim() || c.title; saveConvos(); renderConvoList(); }
}
function deleteConvo(id) {
  if (!confirm('Delete this chat?')) return;
  convos = convos.filter(c => c.id !== id);
  if (curId === id) curId = convos[0]?.id || '';
  saveConvos(); localStorage.setItem(CUR_KEY, curId);
  if (!curId) newConvo(); else { renderConvoList(); renderChat(); }
}

/* sidebar open/close */
const openNav = () => document.body.classList.add('nav-open');
const closeNav = () => document.body.classList.remove('nav-open');
$('menuBtn').onclick = openNav;
$('scrim').onclick = closeNav;
$('newChatBtn').onclick = newConvo;

/* ============ Live step mirror ============ */
// Polls the server and shows, in real time, each step Baadar takes for this task.
function startActivity(sessionId) {
  const box = document.createElement('div');
  box.className = 'steps';
  box.innerHTML = '<div class="steps-title">Baadar is working…</div>';
  chat.appendChild(box); chat.scrollTop = chat.scrollHeight;
  const ctl = { done: false, deadline: null };
  (async () => {
    let after = 0;
    while (true) {
      try {
        const r = await fetch(API + '/api/v1/agent/activity?session_id='
                              + encodeURIComponent(sessionId) + '&after=' + after);
        const data = await r.json();
        for (const e of (data.events || [])) {
          after = e.seq;
          const d = document.createElement('div');
          d.className = 'st ' + e.kind; d.textContent = e.text;
          box.appendChild(d); chat.scrollTop = chat.scrollHeight;
          if (e.kind === 'done') ctl.done = true;
        }
      } catch (e) {}
      if (ctl.done) break;
      if (ctl.deadline && Date.now() > ctl.deadline) break;
      await new Promise(r => setTimeout(r, 500));
    }
    box.classList.add('finished');
    const t = box.querySelector('.steps-title');
    if (t) t.textContent = 'Steps';
  })();
  return ctl;
}

/* ============ Hands-free engine ============ */
let listening = false, audioCtx, analyser, micStream, recorder, chunks = [];
let speechActive = false, silenceStart = 0, speechStart = 0, busy = false;

const VAD = { threshold: 0.013, silenceMs: 1100, minSpeechMs: 450, maxMs: 20000 };

orbZone.onclick = async () => {
  if (listening) return stopListening();
  try { await startListening(); }
  catch (e) { addMeta('⚠️ mic error: ' + e.message); }
};

async function startListening() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true } });
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  listening = true;
  setState('listening');
  vadLoop();
}

function stopListening() {
  listening = false;
  micStream?.getTracks().forEach(t => t.stop());
  audioCtx?.close();
  if (recorder?.state === 'recording') recorder.stop();
  setState('idle');
}

function rms() {
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let s = 0;
  for (const v of buf) { const x = (v - 128) / 128; s += x * x; }
  return Math.sqrt(s / buf.length);
}

function vadLoop() {
  if (!listening) return;
  const level = rms();
  // orb glow follows voice
  document.body.style.setProperty('--level', Math.min(level * 600, 50) + 'px');
  document.body.style.setProperty('--levelScale', Math.min(level * 1.2, 0.12));

  const now = performance.now();
  if (!busy) {
    if (!speechActive && level > VAD.threshold) {
      speechActive = true; speechStart = now; silenceStart = 0;
      startRecorder();
    } else if (speechActive) {
      if (level > VAD.threshold) silenceStart = 0;
      else if (!silenceStart) silenceStart = now;
      const dur = now - speechStart;
      if ((silenceStart && now - silenceStart > VAD.silenceMs) || dur > VAD.maxMs) {
        speechActive = false;
        if (dur >= VAD.minSpeechMs && recorder?.state === 'recording') recorder.stop();
        else if (recorder?.state === 'recording') { recorder.ondataavailable = null; recorder.stop(); chunks = []; }
      }
    }
  }
  requestAnimationFrame(vadLoop);
}

function startRecorder() {
  chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => { if (chunks.length) sendUtterance(new Blob(chunks, { type: recorder.mimeType })); };
  recorder.start();
}

async function sendUtterance(blob) {
  busy = true;
  setState('thinking');
  const act = startActivity(session());
  const form = new FormData();
  form.append('file', blob, 'speech.webm');
  form.append('require_wake', 'true');
  form.append('session_id', session());
  try {
    const r = await fetch(API + '/api/v1/voice/command', { method: 'POST', body: form });
    const data = await r.json();
    act.deadline = Date.now() + 1500;
    if (data.ignored) {
      if (data.ignored === 'no_wake_word') addMeta('(heard, no “Baadar”): ' + (data.transcript || ''));
    } else {
      addMsg(data.transcript, 'user');
      if (data.verification) addMeta(data.verification.verified
          ? '✅ your voice (' + data.verification.similarity + ')'
          : '🔒 voice not recognised — privileged actions locked');
      addMsg(data.reply, 'saathi');
      if (data.reply_audio_b64) await playReply(data.reply_audio_b64, data.reply_audio_mime);
    }
  } catch (e) { addMeta('⚠️ ' + e.message); }
  act.deadline = Date.now() + 1500;
  busy = false;
  setState(listening ? 'listening' : 'idle');
}

function playReply(b64, mime) {
  return new Promise(res => {
    setState('speaking');
    const a = new Audio('data:' + (mime || 'audio/wav') + ';base64,' + b64);
    a.onended = a.onerror = () => res();
    a.play().catch(() => res());
  });
}

/* ============ Text chat ============ */
async function sendText() {
  const text = $('textIn').value.trim();
  if (!text) return;
  $('textIn').value = '';
  addMsg(text, 'user');
  setState('thinking');
  const act = startActivity(session());
  try {
    const r = await fetch(API + '/api/v1/agent/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, session_id: session(), speaker_verified: true })
    });
    addMsg((await r.json()).reply, 'saathi');
  } catch (e) { addMeta('⚠️ ' + e.message); }
  act.deadline = Date.now() + 1500;   // let the last steps flush in
  setState(listening ? 'listening' : 'idle');
}
$('sendBtn').onclick = sendText;
$('textIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

/* ============ File attach (drag-drop OR + button) ============ */
async function uploadFiles(files) {
  for (const f of files) {
    addMeta('⬆️ uploading ' + f.name + '…');
    const form = new FormData(); form.append('file', f);
    try {
      const r = await fetch(API + '/api/v1/files/upload', { method: 'POST', body: form });
      const data = await r.json();
      addMeta('📎 ' + (data.stored || f.name) + ' (' + Math.round((data.size || f.size)/1024)
              + ' KB) attached — ask Baadar about it');
    } catch (err) { addMeta('⚠️ upload failed: ' + err.message); }
  }
}

// + button → file picker
$('addBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ''; };

// drag & drop anywhere
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth) document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

/* ============ Boot ============ */
if (!convos.length || !curConvo()) {
  if (!convos.length) { convos.push({ id: newId(), title: 'New chat', msgs: [], ts: Date.now() }); }
  curId = convos[0].id; localStorage.setItem(CUR_KEY, curId); saveConvos();
}
renderConvoList();
renderChat();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
