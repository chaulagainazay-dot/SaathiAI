<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Baadar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0a12;
         color: #e8e8f0; display: flex; flex-direction: column; overflow: hidden; }

  @keyframes spin { to { transform: rotate(360deg); } }

  #stateLabel { font-size: 12px; color: #a78bfa; font-weight: 600;
                letter-spacing: .3px; min-height: 15px; text-align: center; }

  /* ---------- Top panel: what's connected to this chat ---------- */
  #topPanel { flex-shrink: 0; padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
              display: flex; flex-direction: column; gap: 7px; border-bottom: 1px solid #1c1c28; }
  #pieltsDash { background: linear-gradient(135deg, #1a1430, #11111b);
                border: 1px solid #2e2350; border-radius: 14px; padding: 11px 13px; margin: 0 32px; }
  .pd-head { display: flex; justify-content: space-between; align-items: baseline; }
  .pd-title { font-size: 15px; font-weight: 800; color: #ddd6fe; letter-spacing: .3px; }
  .pd-day { font-size: 11px; font-weight: 700; color: #10b981; }
  .pd-stats { display: flex; gap: 8px; margin-top: 10px; }
  .pd-tile { flex: 1; background: #0d0d16; border: 1px solid #23233a; border-radius: 10px; padding: 8px 9px; }
  .pd-tile .v { font-size: 16px; font-weight: 800; color: #fff; }
  .pd-tile .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: #6a6a85; }
  .pd-tile .bar { height: 4px; border-radius: 3px; background: #241a3d; margin-top: 5px; overflow: hidden; }
  .pd-tile .fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg,#7c3aed,#10b981); transition: width .5s; }
  .pd-goal { font-size: 11px; color: #c9b8f0; margin-top: 10px; line-height: 1.5;
             background: #160f29; border: 1px solid #2e2350; border-radius: 9px; padding: 7px 10px; }
  .pd-goal b { color: #ffd479; }
  .pd-uploads { margin-top: 9px; }
  .pd-uploads summary { font-size: 11px; color: #8a8aa0; cursor: pointer; list-style: none; }
  .pd-uploads summary::-webkit-details-marker { display: none; }
  #pdUpList { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; max-height: 130px; overflow-y: auto; }
  #pdUpList a { font-size: 11.5px; color: #93c5fd; text-decoration: none; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  #pdUpList a:hover { text-decoration: underline; }
  #connSummary { background: #11111b; border: 1px solid #23233a; border-radius: 14px;
                 padding: 9px 12px; cursor: pointer; margin: 0 32px; }
  #connSummary:hover { border-color: #3a3a55; }
  .cs-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #6a6a85; }
  #csIcons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .cs-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
             padding: 3px 9px; border-radius: 11px; background: #1a1a26; color: #555;
             border: 1px solid transparent; opacity: .5; }
  .cs-chip.on { opacity: 1; color: #d8d8e8; background: #241a3d; border-color: #4c1d95; }
  .cs-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
  .cs-chip.on .dot { background: #10b981; }
  .cs-none { font-size: 12px; color: #c4b5fd; }

  /* ---------- Transcript ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 10px 18px;
          display: flex; flex-direction: column; gap: 9px; }
  .msg { max-width: 86%; padding: 9px 14px; border-radius: 14px; font-size: 14px;
         line-height: 1.5; white-space: pre-wrap; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }
  .user { align-self: flex-end; background: #4c1d95; }
  .saathi { align-self: flex-start; background: #16161e; border: 1px solid #2a2a3a; }
  .meta { font-size: 10px; color: #555; align-self: center; }

  /* ---------- Live steps (mirror of what Baadar is doing) ---------- */
  .steps { align-self: flex-start; max-width: 92%; background: #0f0f18;
           border: 1px solid #23233a; border-radius: 14px; padding: 9px 13px;
           font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .steps-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px;
                 color: #5a5a72; display: flex; align-items: center; gap: 6px; }
  .steps-title::before { content: ''; width: 7px; height: 7px; border-radius: 50%;
                 background: #10b981; animation: blink 1s ease-in-out infinite; }
  .steps.finished .steps-title::before { animation: none; background: #444; }
  @keyframes blink { 50% { opacity: .25; } }
  .st { display: block; line-height: 1.45; animation: pop .2s ease-out; color: #8a8aa0; }
  .st.tool   { color: #c4b5fd; font-weight: 600; }
  .st.result { color: #6ee7b7; }
  .st.think  { color: #6f6f88; font-style: italic; }
  .st.done   { color: #10b981; font-weight: 700; }

  /* ---------- Bottom bar ---------- */
  footer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
           display: flex; gap: 9px; border-top: 1px solid #1c1c28; }
  #textIn { flex: 1; background: #14141e; border: 1px solid #2a2a3a; color: #eee;
            border-radius: 20px; padding: 10px 15px; font-size: 14px; outline: none; }
  button { border: none; border-radius: 20px; padding: 0 16px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  #sendBtn { background: #7c3aed; color: #fff; }
  #micBtn { background: #16161e; color: #c4b5fd; border: 1px solid #2a2a3a;
            padding: 0 13px; font-size: 17px; }
  body[data-state="listening"] #micBtn { background: #1e3a8a; color: #93c5fd;
            animation: micpulse 1.3s ease-out infinite; }
  @keyframes micpulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,.5); }
                        70% { box-shadow: 0 0 0 11px rgba(59,130,246,0); } }
  body[data-state="thinking"] #micBtn { background: #0f3d2e; color: #6ee7b7; }
  body[data-state="speaking"] #micBtn { background: #065f46; color: #6ee7b7; }

  /* ---------- Sidebar / chat history ---------- */
  #menuBtn { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; z-index: 30;
    width: 38px; height: 38px; padding: 0; border-radius: 11px; background: #16161e;
    border: 1px solid #2a2a3a; color: #c4b5fd; font-size: 17px; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0;
    pointer-events: none; transition: opacity .25s; }
  body.nav-open #scrim { opacity: 1; pointer-events: auto; }
  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 270px; max-width: 82vw; z-index: 41;
    background: #0d0d16; border-right: 1px solid #1c1c28; transform: translateX(-100%);
    transition: transform .25s ease; display: flex; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); }
  body.nav-open #sidebar { transform: translateX(0); }
  .sb-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; padding: 0 4px; }
  .sb-head b { font-size: 15px; color: #ddd6fe; }
  #newChatBtn { background: #7c3aed; color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; }
  #convoList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .convo { display: flex; align-items: center; gap: 4px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; color: #b8b8c8; font-size: 13px; }
  .convo:hover { background: #16161e; }
  .convo.active { background: #241a3d; color: #fff; }
  .convo .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo .ic { opacity: 0; font-size: 12px; padding: 2px 5px; border-radius: 6px; }
  .convo:hover .ic { opacity: .55; }
  .convo .ic:hover { opacity: 1; background: #2a2a3a; }
  #addBtn { background: #16161e; color: #c4b5fd; border: 1px solid #2a2a3a;
    padding: 0 14px; font-size: 22px; line-height: 1; }
  #connBtn { margin-top: 8px; background: #14141e; color: #a78bfa; border: 1px solid #2a2a3a;
    border-radius: 12px; padding: 10px; font-size: 13px; }

  /* ---------- Connections modal ---------- */
  #connModal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 16px; }
  #connModal.open { display: flex; }
  .cm-card { width: 440px; max-width: 100%; max-height: 86vh; overflow-y: auto;
    background: #11111b; border: 1px solid #2a2a3a; border-radius: 18px; padding: 18px; }
  .cm-head { display: flex; justify-content: space-between; align-items: center; }
  .cm-head b { font-size: 16px; color: #ddd6fe; }
  #connClose { background: none; color: #888; font-size: 16px; padding: 4px 8px; }
  .cm-sub { font-size: 12px; color: #8a8aa0; margin: 4px 0 14px; }
  .cm-foot { font-size: 11px; color: #5a5a72; margin-top: 12px; }
  .conn { display: flex; align-items: center; gap: 10px; padding: 11px 0;
    border-top: 1px solid #1c1c28; }
  .conn .ico { font-size: 20px; width: 26px; text-align: center; }
  .conn .info { flex: 1; min-width: 0; }
  .conn .nm { font-size: 14px; color: #e8e8f0; }
  .conn .mt { font-size: 11px; color: #777; }
  .conn input[type=text] { width: 100%; margin-top: 5px; background: #0c0c14;
    border: 1px solid #2a2a3a; color: #ddd; border-radius: 8px; padding: 5px 8px; font-size: 12px; }
  .sw { width: 44px; height: 25px; border-radius: 13px; background: #2a2a3a; position: relative;
    cursor: pointer; flex-shrink: 0; transition: background .2s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px;
    border-radius: 50%; background: #fff; transition: transform .2s; }
  .sw.on { background: #10b981; }
  .sw.on::after { transform: translateX(19px); }

  /* ---------- Notifications / tasks ---------- */
  #notifBtn { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; z-index: 30;
    width: 38px; height: 38px; padding: 0; border-radius: 11px; background: #16161e;
    border: 1px solid #2a2a3a; color: #c4b5fd; font-size: 17px; }
  #notifBadge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 9px; background: #7c3aed; color: #fff; font-size: 11px;
    font-weight: 800; line-height: 18px; text-align: center; display: none;
    box-shadow: 0 0 0 2px #0a0a12; }
  #notifBadge.show { display: block; }

  #notifModal { position: fixed; inset: 0; z-index: 61; background: rgba(0,0,0,.6);
    display: none; justify-content: flex-end; }
  #notifModal.open { display: flex; }
  .nt-drawer { width: 420px; max-width: 100%; height: 100%; background: #11111b;
    border-left: 1px solid #2a2a3a; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .25s ease;
    padding-top: env(safe-area-inset-top); }
  #notifModal.open .nt-drawer { transform: translateX(0); }
  .nt-head { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px 12px; border-bottom: 1px solid #1c1c28; }
  .nt-head b { font-size: 16px; color: #ddd6fe; }
  #notifClose { background: none; color: #888; font-size: 16px; padding: 4px 8px; }
  #notifClear { background: #14141e; color: #a78bfa; border: 1px solid #2a2a3a;
    border-radius: 11px; padding: 6px 11px; font-size: 12px; }
  #notifList { flex: 1; overflow-y: auto; padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; }
  .nt-item { background: #16161e; border: 1px solid #2a2a3a; border-radius: 14px;
    padding: 12px 13px; display: flex; flex-direction: column; gap: 8px; animation: pop .18s ease-out; }
  .nt-item.note { background: #0f0f18; border-color: #23233a; }
  .nt-item.gone { opacity: .4; }
  .nt-top { display: flex; align-items: flex-start; gap: 8px; }
  .nt-kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 800;
    padding: 2px 7px; border-radius: 8px; flex-shrink: 0; background: #241a3d; color: #c4b5fd; }
  .nt-item.note .nt-kind { background: #1a1a26; color: #8a8aa0; }
  .nt-ttl { flex: 1; font-size: 14px; font-weight: 700; color: #e8e8f0; line-height: 1.4;
    word-break: break-word; }
  .nt-body { font-size: 12.5px; color: #a8a8c0; line-height: 1.55; white-space: pre-wrap;
    word-break: break-word; background: #0c0c14; border: 1px solid #1c1c28; border-radius: 9px;
    padding: 8px 10px; max-height: 220px; overflow-y: auto; }
  .nt-actions { display: flex; gap: 7px; flex-wrap: wrap; }
  .nt-btn { border-radius: 11px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; }
  .nt-open { background: #7c3aed; color: #fff; text-decoration: none; display: inline-block; }
  .nt-copy { background: #14141e; color: #93c5fd; border: 1px solid #2a2a3a; }
  .nt-done { background: #14141e; color: #6ee7b7; border: 1px solid #2a2a3a; margin-left: auto; }
  .nt-empty { text-align: center; color: #8a8aa0; font-size: 14px; padding: 48px 20px; line-height: 1.6; }
  .nt-empty .big { font-size: 34px; display: block; margin-bottom: 10px; }

  /* ---------- Drag & drop ---------- */
  #dropOverlay { position: fixed; inset: 0; background: rgba(124,58,237,.18);
      border: 3px dashed #a78bfa; display: none; align-items: center;
      justify-content: center; z-index: 50; backdrop-filter: blur(2px);
      font-size: 20px; color: #ddd6fe; font-weight: 700; }
  body.dragging #dropOverlay { display: flex; }
</style>
</head>
<body data-state="idle">

<button id="menuBtn" title="Chats">☰</button>
<button id="notifBtn" title="Notifications &amp; tasks">🔔<span id="notifBadge"></span></button>
<div id="scrim"></div>
<aside id="sidebar">
  <div class="sb-head"><b>🏔️ Baadar</b><button id="newChatBtn">+ New</button></div>
  <div id="convoList"></div>
  <button id="connBtn">🔗 Connect socials</button>
</aside>

<div id="connModal">
  <div class="cm-card">
    <div class="cm-head"><b>🔗 Connect your socials</b><button id="connClose">✕</button></div>
    <p class="cm-sub">Connect once — then Baadar can post & plan across all of them.</p>
    <div id="connList"></div>
    <p class="cm-foot">Auto = Baadar posts for you · Assisted = Baadar preps it, you tap upload.</p>
  </div>
</div>

<div id="topPanel">
  <div id="pieltsDash">
    <div class="pd-head"><span class="pd-title">🏔️ PIELTS</span><span class="pd-day" id="pdDay">Day 1</span></div>
    <div class="pd-stats" id="pdStats"></div>
    <div class="pd-goal" id="pdGoal"></div>
    <details class="pd-uploads"><summary id="pdUpSum">Uploads</summary><div id="pdUpList"></div></details>
  </div>
  <div id="connSummary" title="Tap to connect / manage your socials">
    <span class="cs-label">🔗 Connected to this chat</span>
    <div id="csIcons"></div>
  </div>
  <div id="stateLabel"></div>
</div>

<div id="chat"></div>

<footer>
  <button id="addBtn" title="Attach file, PDF or image">+</button>
  <input id="fileIn" type="file" multiple hidden
         accept="image/*,application/pdf,.doc,.docx,.txt,.csv,.xlsx">
  <input id="textIn" placeholder="type to Baadar…" autocomplete="off">
  <button id="micBtn" title="Tap to talk">🎤</button>
  <button id="sendBtn">Send</button>
</footer>

<div id="notifModal">
  <div class="nt-drawer">
    <div class="nt-head">
      <b>🔔 Notifications &amp; tasks</b>
      <span style="display:flex;gap:6px;align-items:center;">
        <button id="notifClear" title="Clear done items">Clear done</button>
        <button id="notifClose">✕</button>
      </span>
    </div>
    <div id="notifList"></div>
  </div>
</div>

<div id="dropOverlay">📂 Drop files for Baadar</div>

<script>
const API = location.origin;
const $ = id => document.getElementById(id);

// access key: arrives once as #token=… in the URL, then lives in localStorage
if (location.hash.startsWith('#token=')) {
  localStorage.setItem('saathi_token', location.hash.slice(7));
  history.replaceState(null, '', location.pathname);
}
const TOKEN = localStorage.getItem('saathi_token') || '';
const _fetch = window.fetch;
window.fetch = (url, opts = {}) => {
  opts.headers = Object.assign({}, opts.headers, TOKEN ? {'X-Saathi-Token': TOKEN} : {});
  return _fetch(url, opts);
};
const chat = $('chat'), label = $('stateLabel');

let state = 'idle';
function setState(s, text) {
  state = s;
  document.body.dataset.state = s;
  label.textContent = text || {
    idle: '',
    listening: '🎙️ listening…',
    thinking: 'thinking…',
    speaking: 'Baadar is speaking…',
  }[s];
}

// low-level DOM render (no persistence) — used when replaying history
function renderMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function renderMeta(text) {
  const d = document.createElement('div');
  d.className = 'meta'; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
// render + save into the current conversation
function addMsg(text, cls) { renderMsg(text, cls); pushMsg(cls === 'user' ? 'user' : 'saathi', text, false); }
function addMeta(text)      { renderMeta(text);       pushMsg('meta', text, true); }

/* ============ Conversation history (categorise your work) ============ */
const CONVO_KEY = 'baadar_convos', CUR_KEY = 'baadar_cur';
let convos = []; try { convos = JSON.parse(localStorage.getItem(CONVO_KEY) || '[]'); } catch (e) {}
let curId = localStorage.getItem(CUR_KEY) || '';

const saveConvos = () => localStorage.setItem(CONVO_KEY, JSON.stringify(convos));
const curConvo = () => convos.find(c => c.id === curId);
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const session = () => curId || 'default';

function pushMsg(role, text, isMeta) {
  const c = curConvo(); if (!c) return;
  c.msgs.push({ role, text, meta: !!isMeta });
  if (c.title === 'New chat' && role === 'user' && !isMeta) c.title = text.slice(0, 42);
  c.ts = Date.now();
  saveConvos(); renderConvoList();
}

function renderChat() {
  chat.innerHTML = '';
  const c = curConvo();
  (c ? c.msgs : []).forEach(m => m.meta ? renderMeta(m.text)
        : renderMsg(m.text, m.role === 'user' ? 'user' : 'saathi'));
}

function renderConvoList() {
  const list = $('convoList'); list.innerHTML = '';
  convos.slice().sort((a, b) => b.ts - a.ts).forEach(c => {
    const row = document.createElement('div');
    row.className = 'convo' + (c.id === curId ? ' active' : '');
    row.innerHTML = `<span class="nm"></span>`
      + `<span class="ic" data-act="rename" title="Rename / categorise">✎</span>`
      + `<span class="ic" data-act="del" title="Delete">🗑</span>`;
    row.querySelector('.nm').textContent = c.title || 'Untitled';
    row.querySelector('.nm').onclick = () => switchConvo(c.id);
    row.querySelector('[data-act=rename]').onclick = e => { e.stopPropagation(); renameConvo(c.id); };
    row.querySelector('[data-act=del]').onclick = e => { e.stopPropagation(); deleteConvo(c.id); };
    list.appendChild(row);
  });
}

function newConvo() {
  const c = { id: newId(), title: 'New chat', msgs: [], ts: Date.now() };
  convos.unshift(c); curId = c.id; localStorage.setItem(CUR_KEY, curId);
  saveConvos(); renderConvoList(); renderChat(); closeNav();
}
function switchConvo(id) { curId = id; localStorage.setItem(CUR_KEY, id); renderConvoList(); renderChat(); closeNav(); }
function renameConvo(id) {
  const c = convos.find(x => x.id === id); if (!c) return;
  const t = prompt('Name this chat / category:', c.title);
  if (t !== null) { c.title = t.trim() || c.title; saveConvos(); renderConvoList(); }
}
function deleteConvo(id) {
  if (!confirm('Delete this chat?')) return;
  convos = convos.filter(c => c.id !== id);
  if (curId === id) curId = convos[0]?.id || '';
  saveConvos(); localStorage.setItem(CUR_KEY, curId);
  if (!curId) newConvo(); else { renderConvoList(); renderChat(); }
}

/* sidebar open/close */
const openNav = () => document.body.classList.add('nav-open');
const closeNav = () => document.body.classList.remove('nav-open');
$('menuBtn').onclick = openNav;
$('scrim').onclick = closeNav;
$('newChatBtn').onclick = newConvo;

/* ============ Social connections ============ */
const PLATFORMS = [
  { id: 'facebook', name: 'Facebook',  icon: '📘' },
  { id: 'instagram', name: 'Instagram', icon: '📸' },
  { id: 'tiktok',   name: 'TikTok',    icon: '🎵' },
  { id: 'youtube',  name: 'YouTube',   icon: '▶️' },
  { id: 'linkedin', name: 'LinkedIn',  icon: '💼' },
  { id: 'x',        name: 'X',         icon: '✖️' },
];
const METHOD_LABEL = { browser: 'Auto · browser', n8n: 'Auto · n8n webhook', manual: 'Assisted · you upload' };

async function openConnections() {
  closeNav();
  let data = {};
  try { data = (await (await fetch(API + '/api/v1/connections')).json()).connections || {}; } catch (e) {}
  const list = $('connList'); list.innerHTML = '';
  PLATFORMS.forEach(p => {
    const c = data[p.id] || { connected: false, method: 'manual', handle: '', webhook: '' };
    const row = document.createElement('div');
    row.className = 'conn';
    row.innerHTML =
      `<span class="ico">${p.icon}</span>`
      + `<div class="info"><div class="nm">${p.name}</div>`
      + `<div class="mt">${METHOD_LABEL[c.method] || c.method}</div>`
      + (c.method === 'n8n'
          ? `<input type="text" class="wh" placeholder="n8n webhook URL (optional)" value="${c.webhook || ''}">` : '')
      + `<input type="text" class="hd" placeholder="handle e.g. @pieltsapp" value="${c.handle || ''}"></div>`
      + `<div class="sw ${c.connected ? 'on' : ''}"></div>`;
    const sw = row.querySelector('.sw');
    const save = (extra) => fetch(API + '/api/v1/connections', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ platform: p.id, connected: sw.classList.contains('on'),
        handle: row.querySelector('.hd').value,
        webhook: row.querySelector('.wh')?.value || '' }, extra)) });
    sw.onclick = () => { sw.classList.toggle('on'); save(); };
    row.querySelectorAll('input').forEach(inp => inp.onchange = () => save());
    list.appendChild(row);
  });
  $('connModal').classList.add('open');
}

/* ============ Live step mirror ============ */
// Polls the server and shows, in real time, each step Baadar takes for this task.
function startActivity(sessionId) {
  const box = document.createElement('div');
  box.className = 'steps';
  box.innerHTML = '<div class="steps-title">Baadar is working…</div>';
  chat.appendChild(box); chat.scrollTop = chat.scrollHeight;
  const ctl = { done: false, deadline: null };
  (async () => {
    let after = 0;
    while (true) {
      try {
        const r = await fetch(API + '/api/v1/agent/activity?session_id='
                              + encodeURIComponent(sessionId) + '&after=' + after);
        const data = await r.json();
        for (const e of (data.events || [])) {
          after = e.seq;
          const d = document.createElement('div');
          d.className = 'st ' + e.kind; d.textContent = e.text;
          box.appendChild(d); chat.scrollTop = chat.scrollHeight;
          if (e.kind === 'done') ctl.done = true;
        }
      } catch (e) {}
      if (ctl.done) break;
      if (ctl.deadline && Date.now() > ctl.deadline) break;
      await new Promise(r => setTimeout(r, 500));
    }
    box.classList.add('finished');
    const t = box.querySelector('.steps-title');
    if (t) t.textContent = 'Steps';
  })();
  return ctl;
}

/* ============ Hands-free engine ============ */
let listening = false, audioCtx, analyser, micStream, recorder, chunks = [];
let speechActive = false, silenceStart = 0, speechStart = 0, busy = false;

const VAD = { threshold: 0.013, silenceMs: 1100, minSpeechMs: 450, maxMs: 20000 };

$('micBtn').onclick = async () => {
  if (listening) return stopListening();
  try { await startListening(); }
  catch (e) { addMeta('⚠️ mic error: ' + e.message); }
};

async function startListening() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true } });
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  listening = true;
  setState('listening');
  vadLoop();
}

function stopListening() {
  listening = false;
  micStream?.getTracks().forEach(t => t.stop());
  audioCtx?.close();
  if (recorder?.state === 'recording') recorder.stop();
  setState('idle');
}

function rms() {
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let s = 0;
  for (const v of buf) { const x = (v - 128) / 128; s += x * x; }
  return Math.sqrt(s / buf.length);
}

function vadLoop() {
  if (!listening) return;
  const level = rms();
  // orb glow follows voice
  document.body.style.setProperty('--level', Math.min(level * 600, 50) + 'px');
  document.body.style.setProperty('--levelScale', Math.min(level * 1.2, 0.12));

  const now = performance.now();
  if (!busy) {
    if (!speechActive && level > VAD.threshold) {
      speechActive = true; speechStart = now; silenceStart = 0;
      startRecorder();
    } else if (speechActive) {
      if (level > VAD.threshold) silenceStart = 0;
      else if (!silenceStart) silenceStart = now;
      const dur = now - speechStart;
      if ((silenceStart && now - silenceStart > VAD.silenceMs) || dur > VAD.maxMs) {
        speechActive = false;
        if (dur >= VAD.minSpeechMs && recorder?.state === 'recording') recorder.stop();
        else if (recorder?.state === 'recording') { recorder.ondataavailable = null; recorder.stop(); chunks = []; }
      }
    }
  }
  requestAnimationFrame(vadLoop);
}

function startRecorder() {
  chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => { if (chunks.length) sendUtterance(new Blob(chunks, { type: recorder.mimeType })); };
  recorder.start();
}

async function sendUtterance(blob) {
  busy = true;
  setState('thinking');
  const act = startActivity(session());
  const form = new FormData();
  form.append('file', blob, 'speech.webm');
  form.append('require_wake', 'true');
  form.append('session_id', session());
  try {
    const r = await fetch(API + '/api/v1/voice/command', { method: 'POST', body: form });
    const data = await r.json();
    act.deadline = Date.now() + 1500;
    if (data.ignored) {
      if (data.ignored === 'no_wake_word') addMeta('(heard, no “Baadar”): ' + (data.transcript || ''));
    } else {
      addMsg(data.transcript, 'user');
      if (data.verification) addMeta(data.verification.verified
          ? '✅ your voice (' + data.verification.similarity + ')'
          : '🔒 voice not recognised — privileged actions locked');
      addMsg(data.reply, 'saathi');
      if (data.reply_audio_b64) await playReply(data.reply_audio_b64, data.reply_audio_mime);
    }
  } catch (e) { addMeta('⚠️ ' + e.message); }
  act.deadline = Date.now() + 1500;
  busy = false;
  setState(listening ? 'listening' : 'idle');
}

function playReply(b64, mime) {
  return new Promise(res => {
    setState('speaking');
    const a = new Audio('data:' + (mime || 'audio/wav') + ';base64,' + b64);
    a.onended = a.onerror = () => res();
    a.play().catch(() => res());
  });
}

/* ============ Text chat ============ */
async function sendText() {
  const text = $('textIn').value.trim();
  if (!text) return;
  $('textIn').value = '';
  addMsg(text, 'user');
  setState('thinking');
  const act = startActivity(session());
  try {
    const r = await fetch(API + '/api/v1/agent/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, session_id: session(), speaker_verified: true })
    });
    addMsg((await r.json()).reply, 'saathi');
  } catch (e) { addMeta('⚠️ ' + e.message); }
  act.deadline = Date.now() + 1500;   // let the last steps flush in
  setState(listening ? 'listening' : 'idle');
}
$('sendBtn').onclick = sendText;
$('textIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

/* ============ File attach (drag-drop OR + button) ============ */
async function uploadFiles(files) {
  for (const f of files) {
    addMeta('⬆️ uploading ' + f.name + '…');
    const form = new FormData(); form.append('file', f);
    try {
      const r = await fetch(API + '/api/v1/files/upload', { method: 'POST', body: form });
      const data = await r.json();
      addMeta('📎 ' + (data.stored || f.name) + ' (' + Math.round((data.size || f.size)/1024)
              + ' KB) attached — ask Baadar about it');
    } catch (err) { addMeta('⚠️ upload failed: ' + err.message); }
  }
}

// + button → file picker
$('addBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ''; };

// drag & drop anywhere
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth) document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

/* ============ Notifications & tasks ============ */
let notifItems = [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function updateNotifBadge() {
  const n = notifItems.filter(i => !i.done).length;
  const b = $('notifBadge');
  b.textContent = n > 99 ? '99+' : n;
  b.classList.toggle('show', n > 0);
}

async function fetchNotifs(render) {
  try {
    const r = await fetch(API + '/api/v1/tasks');
    const data = await r.json();
    notifItems = Array.isArray(data.items) ? data.items : [];
  } catch (e) {}
  updateNotifBadge();
  if (render && $('notifModal').classList.contains('open')) renderNotifs();
}

function renderNotifs() {
  const list = $('notifList');
  list.innerHTML = '';
  const items = notifItems.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!items.length) {
    list.innerHTML = `<div class="nt-empty"><span class="big">✅</span>You're all caught up</div>`;
    return;
  }
  items.forEach(it => {
    const isTask = it.kind === 'task';
    const row = document.createElement('div');
    row.className = 'nt-item ' + (isTask ? 'task' : 'note') + (it.done ? ' gone' : '');
    let html = `<div class="nt-top">`
      + `<span class="nt-kind">${isTask ? 'Task' : 'Note'}</span>`
      + `<span class="nt-ttl">${esc(it.title)}</span></div>`;
    if (it.body) html += `<div class="nt-body">${esc(it.body)}</div>`;
    html += `<div class="nt-actions">`;
    if (it.link) html += `<a class="nt-btn nt-open" href="${esc(it.link)}" target="_blank" rel="noopener">Open ↗</a>`;
    if (it.body) html += `<button class="nt-btn nt-copy">Copy</button>`;
    if (!it.done) html += `<button class="nt-btn nt-done">Done</button>`;
    html += `</div>`;
    row.innerHTML = html;
    const copyBtn = row.querySelector('.nt-copy');
    if (copyBtn) copyBtn.onclick = () => {
      (navigator.clipboard?.writeText(it.body) || Promise.reject())
        .then(() => { copyBtn.textContent = 'Copied ✓'; setTimeout(() => copyBtn.textContent = 'Copy', 1400); })
        .catch(() => { copyBtn.textContent = 'Copy failed'; setTimeout(() => copyBtn.textContent = 'Copy', 1400); });
    };
    const doneBtn = row.querySelector('.nt-done');
    if (doneBtn) doneBtn.onclick = async () => {
      doneBtn.disabled = true; doneBtn.textContent = '…';
      try { await fetch(API + '/api/v1/tasks/' + encodeURIComponent(it.id) + '/done', { method: 'POST' }); } catch (e) {}
      it.done = true;
      row.classList.add('gone');
      doneBtn.remove();
      updateNotifBadge();
    };
    list.appendChild(row);
  });
}

function openNotifs() { $('notifModal').classList.add('open'); renderNotifs(); fetchNotifs(true); }
function closeNotifs() { $('notifModal').classList.remove('open'); }
$('notifBtn').onclick = openNotifs;
$('notifClose').onclick = closeNotifs;
$('notifModal').onclick = e => { if (e.target === $('notifModal')) closeNotifs(); };
$('notifClear').onclick = async () => {
  try { await fetch(API + '/api/v1/tasks/clear-done', { method: 'POST' }); } catch (e) {}
  await fetchNotifs(true);
};

// PIELTS dashboard — uploads, growth targets, money goal
const fmt = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);
function tile(k, val, cur, goal) {
  let bar = '';
  if (goal) { const pct = Math.min((cur || 0) / goal * 100, 100);
    bar = `<div class="bar"><div class="fill" style="width:${pct}%"></div></div>`; }
  return `<div class="pd-tile"><div class="v">${val}</div><div class="k">${k}</div>${bar}</div>`;
}
async function renderDashboard() {
  try {
    const d = await (await fetch(API + '/api/v1/pielts/dashboard')).json();
    $('pdDay').textContent = 'Day ' + d.day;
    const t = d.targets, s = d.stats || {};
    const subs = s.subscribers, views = s.views;
    $('pdStats').innerHTML =
      tile('Subscribers', subs != null ? fmt(subs) + '/' + fmt(t.subscribers_goal) : '—',
           subs, t.subscribers_goal)
      + tile('Views', views != null ? fmt(views) : '—', views, t.views_goal)
      + tile('Uploads', d.upload_count, 0, 0);
    const costs = (t.costs || []).map(c => c.name).join(', ');
    $('pdGoal').innerHTML = `💰 Goal: <b>$${t.monthly_revenue_goal_usd}/mo</b> to cover ${costs}. `
      + `Channel monetizes at <b>${fmt(t.subscribers_goal)} subscribers</b> — post daily to get there.`
      + (d.has_live_stats ? '' : ' <span style="color:#6a6a85">(add a free YouTube API key for live sub/view counts)</span>');
    const ups = d.uploads || [];
    $('pdUpSum').textContent = `📺 ${d.upload_count} uploads ▾`;
    $('pdUpList').innerHTML = ups.map(u =>
      u.url ? `<a href="${u.url}" target="_blank">▶ ${u.title}</a>` : `<span>▶ ${u.title}</span>`).join('');
  } catch (e) {}
}

renderConvoList();
renderChat();
renderConnSummary();
renderDashboard();
fetchNotifs(false);
setInterval(() => fetchNotifs(true), 30000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
