[project]
name = "saathiai"
version = "0.1.0"
description = "SaathiAI — Ajay's bilingual (Nepali/English) voice agent assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pillow>=10.0",         # thumbnail scoring / image analysis
    "openai>=1.0",          # agent runtime + Gemini(OpenAI-compat)/eval clients
]

[project.optional-dependencies]
voice = [
    "resemblyzer>=0.1.4",   # speaker verification
    "sounddevice>=0.4.6",   # enrollment + push-to-talk recording
    "rumps>=0.4.0",         # macOS menu-bar app
    "pyobjc-framework-Quartz>=10",  # global hotkey event tap (Right Option to talk)
    "faster-whisper>=1.0",  # local speech-to-text (Nepali + English)
]
# AI Studio generation (Mac-side only; the VM records runs but never generates,
# so keep torch/kokoro OUT of the base install). FFmpeg is a system dep (brew).
generation = [
    "kokoro>=0.9.4",        # local TTS narration (pulls torch)
    "soundfile>=0.12",      # WAV I/O + duration
    "pillow>=10",           # deterministic scene-card fallback
]

[project.scripts]
saathi = "saathi.server:main"
saathi-listen = "saathi.listener:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saathi*"]
exclude = ["saathi-os*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
