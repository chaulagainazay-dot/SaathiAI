[project]
name = "saathiai"
version = "0.1.0"
description = "SaathiAI — Ajay's bilingual (Nepali/English) voice agent assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
voice = [
    "resemblyzer>=0.1.4",   # speaker verification
    "sounddevice>=0.4.6",   # enrollment recording
]

[project.scripts]
saathi = "saathi.server:main"
saathi-listen = "saathi.listener:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saathi", "saathi.tools"]
