[project]
name = "saathiai"
version = "0.1.0"
description = "SaathiAI — Ajay's bilingual (Nepali/English) voice agent assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pillow>=10.0",         # thumbnail scoring / image analysis
    "openai>=1.0",          # agent runtime + Gemini(OpenAI-compat)/eval clients
    # Imported unconditionally by saathi/ modules, so they belong in the base
    # install, not in an extra. Clean-clone verification found each of these
    # failing to import from a fresh checkout.
    "groq>=0.4.0",          # saathi/agents/master.py, sub_agents/base.py
    # [crypto] pulls `cryptography`, required for the RS256 JWKS verification
    # in saathi/auth_logto.py (jwt.PyJWKClient + algorithms=["RS256"]).
    "PyJWT[crypto]>=2.8",   # saathi/auth_logto.py
    "PyYAML>=6.0",          # saathi/security/redteam/runner.py
]

[project.optional-dependencies]
voice = [
    "resemblyzer>=0.1.4",   # speaker verification
    "sounddevice>=0.4.6",   # enrollment + push-to-talk recording
    "rumps>=0.4.0",         # macOS menu-bar app
    "pyobjc-framework-Quartz>=10",  # global hotkey event tap (Right Option to talk)
    "faster-whisper>=1.0",  # local speech-to-text (Nepali + English)
]
# AI Studio generation (Mac-side only; the VM records runs but never generates,
# so keep torch/kokoro OUT of the base install). FFmpeg is a system dep (brew).
generation = [
    "kokoro>=0.9.4",        # local TTS narration (pulls torch)
    "soundfile>=0.12",      # WAV I/O + duration
    "pillow>=10",           # deterministic scene-card fallback
]
# Test tooling. The private-alpha runbooks already tell operators to run
# `pip install -e '.[dev]'`, but the extra did not exist and pytest was declared
# nowhere, so a clean clone could not run the suite from committed source alone.
# [tool.pytest.ini_options] below configures pytest; this is what installs it.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
saathi = "saathi.server:main"
saathi-listen = "saathi.listener:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saathi*"]
exclude = ["saathi-os*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: local integration tests excluded from bounded offline certification",
    "network: tests that may access a network endpoint",
    "browser: tests that launch or require a browser",
    "live: tests requiring live external infrastructure",
    "external: tests requiring an external provider or service",
    "live_ollama: tests requiring a running local Ollama service",
]

[tool.setuptools.package-data]
"saathi.production" = ["agency_prompts/*.md", "agency_prompts/*.txt"]
# Authoritative development-agent role registry (M345+). Must ship in wheels and
# editable installs so clean clones and GitHub Actions resolve DATA_PATH.
"saathi.agentdev" = ["data/*.json"]
