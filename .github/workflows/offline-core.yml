# SaathiOS — OFFLINE CORE lane.
#
# This lane must never require a live external API, a browser, a broker, or a
# provider credential. It is the gate that every change passes before any
# market-data or trading lane runs.
name: offline-core

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: offline-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Syntax check
        run: python -m compileall -q . -x "node_modules|/\.venv|/\.git"

      - name: Offline regression
        # Excludes browser / live / external / network by marker. No API keys,
        # no browser, no broker, no provider credential is available to this job
        # and none is required.
        run: |
          pytest tests -q --no-header \
            -m "not browser and not live and not external and not network"

      - name: Assert the working tree is clean
        # A test run must not mutate tracked files. TEST-INFRA-2 fixed evidence
        # writers that did exactly that; this step stops the regression returning.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::test run mutated tracked files:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

  trading-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Trading authority regression
        run: |
          pytest -q --no-header \
            tests/execution_integrity \
            tests/test_t_next_4_1_reconciliation_gate.py \
            tests/fund_ledger \
            tests/portfolio_construction \
            tests/portfolio_risk_engine \
            tests/portfolio_performance \
            tests/test_m62_5_paper_broker.py \
            tests/test_m62_6_reconciliation.py \
            tests/test_m166_m175_trading_guardian.py \
            tests/test_execution_gateway.py
